[project]
name = "assurecode-ai-service"
version = "1.0.0a0"
description = "AssureCode AI service (FastAPI): NLP matchmaker, test generation, security audit, RAG, XAI judge."
requires-python = ">=3.11"
# Core runtime — light enough to install for tests/offline dev with FakeEmbedder.
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# Test/dev extras — still no torch.
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]
# Full stack — real embedder (torch), live graph, RAG store, S3. Pulls heavy deps.
full = [
    "sentence-transformers>=3.3.0",
    "neo4j>=5.26.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.6",
    "boto3>=1.35.0",
    # FIPS 204 ML-DSA-87 for the ledger's Merkle-root signatures. Pure Python,
    # so it installs on Windows without a toolchain, which liboqs-python does
    # not. See packages/ledger-client/src/ml_dsa.py.
    "dilithium-py>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
