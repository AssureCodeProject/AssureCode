# =============================================================================
# Kafka overlay. Compose it ON TOP of the base file — it is not standalone:
#
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.kafka.yml up -d
#
# The base file pins EVENT_BUS_TYPE=redis because it ships no broker. This
# overlay adds one, so it also flips the app services over to it. Without the
# service overrides at the bottom, bringing up the overlay would start a Kafka
# nobody publishes to while the services carried on using Redis — which looks
# exactly like a working Kafka deployment until you check where the events went.
#
# ── KRaft, not ZooKeeper ────────────────────────────────────────────────────
# This used to run confluentinc/cp-kafka 7.5.0 against a separate ZooKeeper
# container. It now runs the official apache/kafka image in KRaft combined mode
# (broker + controller in one process), which removes a whole service and, more
# to the point, matches infra/k8s/17-kafka.yaml exactly. A dev topology that
# differs structurally from the deployed one tests the wrong thing.
# =============================================================================

# Broker address is the in-network listener (kafka:29092), not the host one
# (localhost:9092) — see KAFKA_ADVERTISED_LISTENERS below.
x-kafka-env: &kafka-env
  EVENT_BUS_TYPE: kafka
  KAFKA_BROKERS: kafka:29092
  # Single-node dev broker: one replica is all it can hold. KafkaBus reads both
  # of these when it provisions topics (packages/event-bus/src/index.ts,
  # ensureTopics). Kept in sync with infra/k8s/17-kafka.yaml, where the replica
  # count is what makes a higher replication factor possible.
  KAFKA_TOPIC_PARTITIONS: "3"
  KAFKA_TOPIC_REPLICATION: "1"

x-kafka-deps: &kafka-deps
  kafka:
    condition: service_healthy

services:
  kafka:
    image: apache/kafka:3.8.1
    container_name: assurecode-kafka
    ports:
      - '9092:9092'
      - '29092:29092'
    environment:
      KAFKA_NODE_ID: 1
      # Combined mode: this single process is both the broker and the
      # controller quorum. Correct for one node, and the only KRaft topology
      # that does not need a second StatefulSet in k8s.
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      # Two client listeners because two kinds of client exist: containers on
      # the compose network resolve `kafka`, while a host process running
      # `npm -w @assurecode/api-gateway run dev` resolves `localhost`. A broker
      # advertising only one of them works for exactly one of those callers.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Zero, not the 3000ms default: with one consumer per group there is
      # nothing to wait for, and the delay shows up as three dead seconds on
      # every worker start.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # OFF on purpose, and this is the interesting setting in the file.
      #
      # With auto-create on, a typo'd topic name silently becomes a real topic
      # with the broker's default single partition, and the misconfiguration
      # only surfaces later as a consumer group that will not scale past one
      # worker. With it off, KafkaBus.ensureTopics() is load-bearing: if that
      # code path is broken, this stack fails loudly at boot instead of
      # limping. Managed clusters default to off, so this also matches them.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Fixed rather than generated: the image formats the log directory on
      # first boot with this id, and a value that changed between runs would
      # make the existing volume unreadable ("log directory formatted with a
      # different cluster id") on every restart.
      CLUSTER_ID: assurecode-kraft-cluster
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # Lists topics through the broker's own client, so this goes green only
      # once the controller has elected a leader and the API is actually
      # serving — a TCP check on 9092 passes well before that.
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ── Point the event-bus consumers and producers at Kafka ──────
  # Compose merges these into the base file's definitions; only the keys named
  # here change. Every service that publishes or subscribes needs both the
  # override and the dependency, or it starts before the broker exists and its
  # first publish is lost.
  api-gateway:
    environment: *kafka-env
    depends_on: *kafka-deps

  ci-worker:
    environment: *kafka-env
    depends_on: *kafka-deps

  settlement-worker:
    environment: *kafka-env
    depends_on: *kafka-deps

  webhook-ingest:
    environment: *kafka-env
    depends_on: *kafka-deps

volumes:
  kafka-data:
