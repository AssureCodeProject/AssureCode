# =============================================================================
# AssureCode — Docker Compose (integration test stack)
#
# Driven by `npm run test:e2e` (scripts/e2e.mjs). Do not `docker compose up`
# this by hand expecting the app to work — it deliberately contains only the
# data plane. The services under test run on the host, against these ports.
#
# Three things make this file different from docker-compose.yml, and all three
# are deliberate:
#
#   1. Non-clashing host ports (5xxxx range). A test run must never touch the
#      dev stack's data, and developers must not have to shut dev down to run
#      the suite.
#   2. tmpfs instead of named volumes. Every run starts from an empty database,
#      so a test that only passes against a hand-mutated dev database fails
#      here — which is the entire point of having this file.
#   3. Its own compose project name (set by scripts/e2e.mjs), so teardown can
#      remove these containers without touching anything else.
#
# The ports are overridable so CI can dodge a collision, but the defaults are
# what scripts/e2e.mjs assumes.
# =============================================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: assurecode-test-postgres
    ports:
      - "${TEST_POSTGRES_PORT:-55432}:5432"
    environment:
      POSTGRES_USER: assurecode
      POSTGRES_PASSWORD: assurecode_test
      POSTGRES_DB: assurecode_test
      # No durability needed for a database that is destroyed at the end of the
      # run, and fsync off is a large speedup on the migration + seed path.
      POSTGRES_INITDB_ARGS: "--no-sync"
    command: >
      postgres
      -c fsync=off
      -c synchronous_commit=off
      -c full_page_writes=off
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assurecode -d assurecode_test"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: assurecode-test-redis
    ports:
      - "${TEST_REDIS_PORT:-56379}:6379"
    # No appendonly: state must not survive the run.
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  neo4j:
    image: neo4j:5-community
    container_name: assurecode-test-neo4j
    ports:
      - "${TEST_NEO4J_HTTP_PORT:-57474}:7474"
      - "${TEST_NEO4J_BOLT_PORT:-57687}:7687"
    environment:
      NEO4J_AUTH: neo4j/assurecode_test
      NEO4J_server_memory_heap_max__size: 512M
      NEO4J_server_memory_pagecache_size: 256M
    tmpfs:
      - /data
      - /logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "assurecode_test", "RETURN 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  localstack:
    # Pinned, not :latest. As of the 2026.x images, :latest resolves to a build
    # that refuses to start without a LOCALSTACK_AUTH_TOKEN — it exits 55 with
    # "License activation failed" before serving anything. 3.8 is the last
    # community line that runs unlicensed, and a test dependency should be
    # pinned regardless so a registry push cannot break the suite overnight.
    image: localstack/localstack:3.8
    container_name: assurecode-test-localstack
    ports:
      - "${TEST_LOCALSTACK_PORT:-54566}:4566"
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      EAGER_SERVICE_LOADING: 1
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"s3\": \"available\\|running\"'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
