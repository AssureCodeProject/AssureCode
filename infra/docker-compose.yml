# =============================================================================
# AssureCode — Docker Compose (development)
#
# Usage:
#   cp .env.example .env          # configure secrets / ports
#   docker compose -f infra/docker-compose.yml up -d
#
# Services:
#   postgres      PostgreSQL 16 with pgvector extension
#   neo4j         Knowledge graph for matchmaking
#   redis         Event bus (Redis Streams) + caching
#   localstack    S3-compatible artifact storage
#
#   web               React SPA behind nginx on :3000
#   api-gateway       Node/Fastify on :4000
#   ci-worker         Node worker (no exposed port)
#   webhook-ingest    Node/Fastify on :9000
#   ai-service        Python/FastAPI on :8000
#   scope-guard       Python/FastAPI on :8001
#   settlement-worker Node worker (no exposed port)
#   migrate           One-shot schema migration, gates every app service
#
# For fast local DX you can still run any app service on the host with
# `npm -w <pkg> run dev` — bring up only the data plane with:
#   docker compose -f infra/docker-compose.yml up -d postgres neo4j redis localstack
# =============================================================================

# Shared app-service settings, defined once and merged into each service below.
# Extension fields have to live at the top level — Compose validates the
# `services:` mapping strictly, so an `x-` anchor placed in there is rejected as
# a malformed service.
#
# Drift between services is the failure this prevents: a service pointed at a
# different DATABASE_URL than the migration job produces a confusing "relation
# does not exist" rather than an obvious misconfiguration.
x-datastore-env: &datastore-env
  # sslmode=disable is required, not incidental: the Postgres container serves
  # no TLS, and buildDbConfig() only exempts loopback hosts — `postgres` is a
  # service name, so without this it infers a public network and refuses to
  # connect unencrypted. The traffic never leaves the compose bridge network.
  DATABASE_URL: postgresql://${POSTGRES_USER:-assurecode}:${POSTGRES_PASSWORD:-assurecode_local_dev}@postgres:5432/${POSTGRES_DB:-assurecode}?sslmode=disable
  REDIS_URL: redis://redis:6379
  # Overridable, unlike the deliberate EVENT_BUS_TYPE pin below: pointing at a
  # hosted Neo4j (Aura) is a supported configuration, whereas EVENT_BUS_TYPE
  # exists to stop this file promising a broker it does not ship. The default
  # keeps the compose-internal service name for anyone without an override, and
  # the two lines below already read from the environment this way — only the
  # URI was pinned, which made a NEO4J_URI in .env look effective while every
  # container silently kept using the local one.
  NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
  NEO4J_USER: ${NEO4J_USER:-neo4j}
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-assurecode_local_dev}
  # Without this the Neo4j settings above are unreachable in practice: the
  # adapter is opt-in (deps.py:52) and this file forwarded every NEO4J_* value
  # but not the switch that selects them, so a GRAPH_BACKEND=neo4j in .env left
  # every container on Postgres while looking configured for Neo4j.
  GRAPH_BACKEND: ${GRAPH_BACKEND:-postgres}
  S3_ENDPOINT: http://localstack:4566
  S3_BUCKET_NAME: ${S3_BUCKET_NAME:-assurecode-artifacts}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
  AI_SERVICE_URL: http://ai-service:8000
  SCOPE_GUARD_URL: http://scope-guard:8001
  # settlement-worker calls back into the gateway's /score route to trigger XAI
  # scoring when an audit completes, rather than reimplementing that route's
  # contract resolution and telemetry shaping against ai-service directly.
  GATEWAY_URL: http://api-gateway:4000
  # Kill switch for that call. On by default, because off is the state in which
  # a contract can be audited and still never acquire a trust score — the
  # settlement gate then waits forever on a number only a browser can produce.
  ENABLE_AUTO_SCORING: ${ENABLE_AUTO_SCORING:-true}
  # This stack provides LocalStack and creates the bucket (see localstack-init),
  # so there is no reason for ai-service to write a test bundle to its own
  # container disk. Leaving the fallback on hides a broken S3 config: uploads
  # succeed, and ci-worker then fetches the bundle back over HTTP from the one
  # replica that happens to hold it. Matches infra/k8s/01-configmap-secrets.yaml.
  ALLOW_LOCAL_ARTIFACT_FALLBACK: "false"
  # Hardcoded, not ${EVENT_BUS_TYPE:-redis}. This file ships Redis and no
  # broker, so honouring an EVENT_BUS_TYPE=kafka left in a developer's .env
  # would point every service at a Kafka that is not in this stack — and the
  # failure is silent, because a bus with no reachable broker drops events
  # rather than refusing to start. Run the Kafka topology with the overlay,
  # which sets this back to kafka for the services it provides a broker for:
  #   docker compose -f infra/docker-compose.yml -f infra/docker-compose.kafka.yml up -d
  EVENT_BUS_TYPE: redis
  LOG_LEVEL: ${LOG_LEVEL:-info}
  JWT_SECRET: ${JWT_SECRET:-dev_insecure_jwt_secret_change_me}
  SERVICE_TOKEN: ${SERVICE_TOKEN:-dev_insecure_service_token_change_me}
  GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-assurecode_github_secret}
  # A push webhook carries repository coordinates but no file contents, so with
  # this off a real push is refused (with an explanation) and only the
  # gateway's /simulate-push reaches the pipeline. On, ci-worker fetches the
  # commit's source from the GitHub API pinned to the SHA the webhook reported.
  # Off by default because an unconfigured stack should not make outbound calls
  # to github.com on a schedule an attacker controls.
  ENABLE_GITHUB_SOURCE_FETCH: ${ENABLE_GITHUB_SOURCE_FETCH:-false}
  # Required for private repos. Public repos work without it at 60 requests per
  # hour per IP, which one audit of a small repository can exhaust on its own.
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  # GitHub OAuth App (freelancer login + repo connection, server.ts:727). Unset
  # leaves GET /auth/github unregistered and the app falls back to
  # password-only login.
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  GITHUB_TOKEN_ENCRYPTION_KEY: ${GITHUB_TOKEN_ENCRYPTION_KEY:-}
  # Public URL of webhook-ingest (an ngrok tunnel in dev), used to build the
  # payload URL when auto-registering a repo's webhook on
  # PATCH /api/contracts/:id/github-repo.
  WEBHOOK_INGEST_PUBLIC_URL: ${WEBHOOK_INGEST_PUBLIC_URL:-}
  # Razorpay. The default key id is deliberately not a real `rzp_` key, so an
  # unconfigured stack runs on FakeRazorpayAdapter and the full escrow flow
  # still works offline. Put real rzp_test_ credentials in .env to move money.
  RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_mock}
  RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
  RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
  # RazorpayX Payouts' source account — required on every payout API call
  # (settlement-worker's attemptPayout/reconcilePendingPayouts). Missing this
  # produces a real Razorpay 400 ("The account number field is required"),
  # not a silent skip.
  RAZORPAYX_ACCOUNT_NUMBER: ${RAZORPAYX_ACCOUNT_NUMBER:-}
  # Reached by the browser, not by a container, so this stays a host address
  # even inside compose — it ends up in redirect URLs the user follows.
  WEB_APP_URL: ${WEB_APP_URL:-http://localhost:3000}
  CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
  CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
  LLM_PROVIDER: ${LLM_PROVIDER:-cloudflare}
  # The collector's in-network address, NOT the localhost:4317 default in
  # packages/telemetry. Inside a container that default is the container's own
  # loopback, so every span produced by the OTel SDK was exported into a socket
  # nothing was listening on: the instrumentation was real, complete and
  # entirely unobservable. Set here on the shared anchor so all services agree.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317

# Data plane must be healthy before an app service starts. Compose's
# `service_healthy` is what makes this a real gate rather than a start order.
x-datastore-deps: &datastore-deps
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  # ── Infrastructure ────────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg16
    container_name: assurecode-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-assurecode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assurecode_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-assurecode}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-assurecode}"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    # Pinned, not `5-community`. Native vector indexes
    # (CREATE VECTOR INDEX / db.index.vector.queryNodes) are what
    # Neo4jGraphRepo.retrieve_by_embedding depends on, and they are only
    # available from 5.13. A floating major tag resolved to "whatever 5.x is
    # current", which is a silent dependency on a feature that could move.
    image: neo4j:5.26-community
    container_name: assurecode-neo4j
    restart: unless-stopped
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      # This container's OWN credentials, deliberately fixed rather than read
      # from NEO4J_USER/NEO4J_PASSWORD. Those two are *client* settings and may
      # point at a hosted instance (Aura), whose username is an instance id —
      # feeding that here configured the local server with an account Neo4j will
      # not create (the initial user must be `neo4j`) and, worse, made the
      # healthcheck below authenticate to localhost with the remote password, so
      # the container went unhealthy and blocked everything gated on it.
      # Also matches reality: NEO4J_AUTH is only honoured on first init, and the
      # neo4j-data volume already holds these.
      NEO4J_AUTH: neo4j/assurecode_local_dev
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "assurecode_local_dev", "RETURN 1"]
      interval: 8s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: assurecode-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    # Pinned. `:latest` now resolves to a 2026.x build that refuses to start
    # without a LOCALSTACK_AUTH_TOKEN — it exits 55 with "License activation
    # failed" and, because of `restart: unless-stopped`, crash-loops rather than
    # staying down visibly. That is how S3 came to be quietly unavailable in the
    # dev stack: `docker compose up -d` reported success and the container was
    # restarting every few seconds. 3.8 is the last community line that runs
    # unlicensed. Matches infra/docker-compose.test.yml.
    image: localstack/localstack:3.8
    container_name: assurecode-localstack
    restart: unless-stopped
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  localstack-init:
    # LocalStack starts with no buckets. S3ArtifactStore._ensure_client() calls
    # head_bucket() on first use, which fails against a missing bucket — and
    # with ALLOW_LOCAL_ARTIFACT_FALLBACK previously unset, upload() then wrote
    # the test bundle to the container's own disk instead. That succeeds, so
    # nothing reports a problem; ci-worker just fetches the bundle back over
    # HTTP from whichever ai-service replica happens to hold it. scripts/e2e.mjs
    # has always created the bucket for the test stack; this is the dev stack's
    # missing half.
    image: localstack/localstack:3.8
    container_name: assurecode-localstack-init
    environment:
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_ENDPOINT_URL: http://localstack:4566
    # `mb` on an existing bucket exits non-zero, which would make this one-shot
    # fail on every restart after the first and block ai-service behind
    # service_completed_successfully. `|| true` keeps it idempotent; the
    # following `ls` is what actually asserts the bucket is there.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        awslocal --endpoint-url=http://localstack:4566 s3 mb
        s3://${S3_BUCKET_NAME:-assurecode-artifacts} || true;
        awslocal --endpoint-url=http://localstack:4566 s3 ls
        s3://${S3_BUCKET_NAME:-assurecode-artifacts}
    depends_on:
      localstack:
        condition: service_healthy
    restart: "no"

  # ── Application services ──────────────────────────────────────
  #
  # Every one builds from the repo root as context (`context: ..`), because the
  # Dockerfiles COPY workspace package.json files and packages/ — a context of
  # infra/ cannot see them.

  migrate:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.migrate
    image: assurecode/migrate:local
    container_name: assurecode-migrate
    environment:
      <<: *datastore-env
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy
    # One-shot. `service_completed_successfully` on the app services below turns
    # this into a real ordering constraint: nothing serves traffic against an
    # unmigrated schema. The runner is idempotent (tracks _migrations), so a
    # restart re-runs it harmlessly.
    restart: "no"

  seed:
    # Reuses the ai-service image rather than adding a Dockerfile: the seed
    # computes real 384-dim profile embeddings with SentenceTransformerEmbedder,
    # so it needs that image's Python environment and its cached model. Building
    # a second image carrying the same ~90MB model to run one script would be
    # the only alternative.
    #
    # tools/ is mounted rather than baked in because the script is not part of
    # the service. It resolves the repo root as `parents[1]` and then imports
    # from `<root>/apps/ai-service`, so mounting at /srv/tools makes that walk
    # land exactly on APP_HOME (/srv/apps/ai-service) — see the layout rationale
    # in infra/docker/Dockerfile.ai-service.
    image: assurecode/ai-service:local
    container_name: assurecode-seed
    environment:
      <<: *datastore-env
      NODE_ENV: ${NODE_ENV:-development}
      HF_HOME: /home/appuser/.cache/huggingface
    volumes:
      - ../tools:/srv/tools:ro
      - hf-cache:/home/appuser/.cache/huggingface
    working_dir: /srv
    command: ["python", "tools/seed-users.py"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    # One-shot, and idempotent (every write is an upsert keyed on user_id), so a
    # restart re-seeds harmlessly. The gateway gates on this completing:
    # without it `users` is empty, every login 401s, and the UI cannot get past
    # the login screen — a stack that is "up" but unusable.
    restart: "no"

  seed-neo4j-vectors:
    # Writes profile embeddings and the vector index into Neo4j. Same image and
    # mount rationale as `seed` above — it needs the sentence-transformers model
    # to produce vectors in the same space the matchmaker embeds queries into.
    #
    # Separate from `seed` because it targets a different datastore and is only
    # meaningful once the *structural* seed has run: it attaches vectors to
    # :Freelancer nodes it does not create. Compose has no equivalent of
    # `npm run seed:neo4j` (that is a host-side TypeScript script), so this
    # service will report the missing nodes and exit non-zero if the graph is
    # empty — which is the correct, legible failure rather than a silent no-op.
    #
    # Only needed when GRAPH_BACKEND=neo4j. It is harmless otherwise: the
    # vectors simply go unread.
    image: assurecode/ai-service:local
    container_name: assurecode-seed-neo4j-vectors
    profiles: ["neo4j"]
    environment:
      <<: *datastore-env
      NODE_ENV: ${NODE_ENV:-development}
      HF_HOME: /home/appuser/.cache/huggingface
    volumes:
      - ../tools:/srv/tools:ro
      - hf-cache:/home/appuser/.cache/huggingface
    working_dir: /srv
    command: ["python", "tools/seed-neo4j-vectors.py"]
    depends_on:
      neo4j:
        condition: service_healthy
    restart: "no"

  api-gateway:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.gateway
    image: assurecode/api-gateway:local
    container_name: assurecode-api-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-4000}:4000"
    environment:
      <<: *datastore-env
      NODE_ENV: ${NODE_ENV:-development}
      GATEWAY_PORT: 4000
      # Override the shared anchor's internal-network value (http://api-gateway:4000,
      # used by settlement-worker to call back into the gateway). This one has to be
      # the address a BROWSER can reach, since it's what the GitHub OAuth callback
      # URL (server.ts:730) is built from and redirected to — the internal Docker
      # service name is not resolvable outside the compose network.
      GATEWAY_URL: ${GATEWAY_URL:-http://localhost:4000}
    depends_on:
      <<: *datastore-deps
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    healthcheck:
      # busybox wget, not curl — node:20-alpine ships neither curl nor a shell
      # with a /dev/tcp fallback, but wget is part of busybox and always present.
      # /healthz is liveness only; /readyz is the one that probes Postgres and
      # Redis, and using it here would make the container unhealthy (and so
      # restart-looped) during an ordinary database blip.
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:4000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  ci-worker:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.ci-worker
    image: assurecode/ci-worker:local
    container_name: assurecode-ci-worker
    restart: unless-stopped
    ports:
      - "${CI_WORKER_PORT:-5001}:5001"
    environment:
      <<: *datastore-env
      NODE_ENV: ${NODE_ENV:-development}
      # Explicit, matching infra/k8s/07-ci-worker.yaml. DockerSandbox is the
      # stronger boundary but needs the host Docker socket mounted — root-
      # equivalent access on the host, handed to the service whose whole job is
      # executing untrusted freelancer code. Not a trade worth making to run a
      # local demo. See the header of infra/docker/Dockerfile.ci-worker.
      SANDBOX_RUNNER: ${SANDBOX_RUNNER:-node}
    # Neither worker exposes a /healthz — the /metrics surface below is
    # deliberately minimal (metrics-server.ts) and answers only /metrics, not
    # readiness. The k8s manifests settle for `node -e "process.exit(0)"`,
    # which only asserts the Node binary can start — it reports healthy for a
    # worker that has silently lost its bus connection, which is precisely the
    # failure mode a headless consumer has.
    #
    # This probes the thing the worker cannot do its job without: a reachable
    # Redis, which is where every event it consumes comes from. Still not proof
    # that the subscription is live, but it fails on a real class of outage
    # instead of on none at all.
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').createConnection({host:'redis',port:6379,timeout:2000});s.on('connect',()=>{s.destroy();process.exit(0)});s.on('error',()=>process.exit(1));s.on('timeout',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      <<: *datastore-deps
      migrate:
        condition: service_completed_successfully

  settlement-worker:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.settlement-worker
    image: assurecode/settlement-worker:local
    container_name: assurecode-settlement-worker
    restart: unless-stopped
    ports:
      - "${SETTLEMENT_WORKER_PORT:-5002}:5002"
    environment:
      <<: *datastore-env
      NODE_ENV: ${NODE_ENV:-development}
    # Neither worker exposes a /healthz — the /metrics surface below is
    # deliberately minimal (metrics-server.ts) and answers only /metrics, not
    # readiness. The k8s manifests settle for `node -e "process.exit(0)"`,
    # which only asserts the Node binary can start — it reports healthy for a
    # worker that has silently lost its bus connection, which is precisely the
    # failure mode a headless consumer has.
    #
    # This probes the thing the worker cannot do its job without: a reachable
    # Redis, which is where every event it consumes comes from. Still not proof
    # that the subscription is live, but it fails on a real class of outage
    # instead of on none at all.
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').createConnection({host:'redis',port:6379,timeout:2000});s.on('connect',()=>{s.destroy();process.exit(0)});s.on('error',()=>process.exit(1));s.on('timeout',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      <<: *datastore-deps
      migrate:
        condition: service_completed_successfully

  webhook-ingest:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.webhook-ingest
    image: assurecode/webhook-ingest:local
    container_name: assurecode-webhook-ingest
    restart: unless-stopped
    ports:
      - "${WEBHOOK_INGEST_PORT:-9000}:9000"
    environment:
      <<: *datastore-env
      NODE_ENV: ${NODE_ENV:-development}
      WEBHOOK_INGEST_PORT: 9000
    depends_on:
      redis:
        condition: service_healthy
      # Every push is resolved to a contract by a Postgres lookup before it is
      # published, so the database is on the request path now, not optional.
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  ai-service:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.ai-service
    image: assurecode/ai-service:local
    container_name: assurecode-ai-service
    restart: unless-stopped
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    environment:
      <<: *datastore-env
      NODE_ENV: ${NODE_ENV:-development}
      EMBED_PROVIDER: ${EMBED_PROVIDER:-sentence-transformers}
      # The ledger's ML-DSA-87 signing seed.
      #
      # In this service's own environment block, NOT in the shared
      # x-datastore-env anchor: that anchor is merged into all seven containers,
      # which would put the ledger's private key in the process that captures
      # payments and the one that runs untrusted submitted code. ai-service is
      # the only service that signs, because it is the only one that ships
      # dilithium-py.
      #
      # Unset by default. POST /ledger/sign-root then answers 503 and roots seal
      # unsigned, which GET /api/contracts/:id/root reports honestly rather than
      # papering over. Set it in .env to exercise signing locally.
      ML_DSA_SEED_HEX: ${ML_DSA_SEED_HEX:-}
      # The image has no baked model. On first boot sentence-transformers pulls
      # all-MiniLM-L6-v2 (~90MB) from HuggingFace; the volume keeps that out of
      # every subsequent start, which is the difference between a 5s and a
      # 90s restart.
      HF_HOME: /home/appuser/.cache/huggingface
    volumes:
      - hf-cache:/home/appuser/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      # Not just ordering — with ALLOW_LOCAL_ARTIFACT_FALLBACK=false this
      # service cannot store a test bundle at all until the bucket exists, and
      # the first thing it would do about that is fail a contract mid-flow.
      localstack-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  scope-guard:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.scope-guard
    image: assurecode/scope-guard:local
    container_name: assurecode-scope-guard
    restart: unless-stopped
    ports:
      - "${SCOPE_GUARD_PORT:-8001}:8001"
    environment:
      <<: *datastore-env
      NODE_ENV: ${NODE_ENV:-development}
      HF_HOME: /home/appuser/.cache/huggingface
      # Without this GET /scope/drift/{id} is a 503 on every contract: the
      # detector refuses to construct without calibration residuals rather than
      # quote a false-alarm rate against a distribution nobody measured. The
      # file is baked into the image (see Dockerfile.scope-guard); the path is
      # relative to the repo root, which is /srv there.
      SCOPE_DRIFT_CALIBRATION_PATH: ${SCOPE_DRIFT_CALIBRATION_PATH:-infra/calibration/scope_drift_synthetic_t2.json}
      # 1 means "these residuals are not a real measurement", and the flag
      # travels into the drift response and the ledger record. It stays 1 until
      # the dual-annotated T2 set exists (configs/c1_rules.json). Shipping the
      # synthetic set with the flag off would be the actual dishonesty here —
      # shipping it with the flag on just makes the endpoint answerable.
      SCOPE_DRIFT_CALIBRATION_SYNTHETIC: ${SCOPE_DRIFT_CALIBRATION_SYNTHETIC:-1}
      SCOPE_SIMILARITY_THRESHOLD: ${SCOPE_SIMILARITY_THRESHOLD:-0.3056}
    volumes:
      - hf-cache:/home/appuser/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8001/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  web:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.web
    image: assurecode/web:local
    container_name: assurecode-web
    restart: unless-stopped
    ports:
      # 3000 on the host, 8080 in the container — the image is
      # nginx-unprivileged and cannot bind a privileged port.
      - "${WEB_PORT:-3000}:8080"
    volumes:
      # Compose has no Ingress, and the SPA calls relative paths, so the
      # frontend origin has to forward /api. The published image deliberately
      # does not (see infra/docker/nginx.conf); mounting the config here adds
      # the proxy for compose only, leaving the image byte-identical to the one
      # Kubernetes runs.
      - ./docker/nginx.compose.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
    depends_on:
      - api-gateway
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ── Observability ─────────────────────────────────────────────
  #
  # packages/telemetry emits OTLP spans and Prometheus metrics and always has.
  # Until now nothing in this file received either, so the instrumentation
  # produced no observable output: OTEL_EXPORTER_OTLP_ENDPOINT defaulted to a
  # container's own loopback and /metrics was exposed but never scraped.
  #
  # These four services close that loop. They are ordinary compose services
  # rather than a separate overlay because a stack whose traces go nowhere is
  # the state this is fixing; if you need to skip them on a small machine, use
  #   docker compose up -d --scale grafana=0 --scale prometheus=0

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    container_name: assurecode-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"   # OTLP gRPC — what the SDK uses
      - "${OTEL_HTTP_PORT:-4318}:4318"   # OTLP HTTP
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: assurecode-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"  # trace UI

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: assurecode-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Referenced by rule_files: in prometheus.yml. Mounted separately so a
      # rule edit does not require touching the scrape config.
      - ./observability/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:11.3.1
    container_name: assurecode-grafana
    restart: unless-stopped
    environment:
      # Anonymous viewer access. This is a local development stack behind no
      # network boundary of its own; requiring a login here protects nothing
      # and makes the dashboards harder to screenshot for the report. Do not
      # carry this setting to a deployed Grafana.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      # Grafana previously had a datasource mount and no dashboard mount, so it
      # booted connected to Prometheus with nothing to display. The metrics were
      # already there and already scraped; only the dashboard was missing.
      - ./observability/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./observability/dashboards:/etc/assurecode/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
      - jaeger

volumes:
  postgres-data:
  neo4j-data:
  redis-data:
  localstack-data:
  hf-cache:
  prometheus-data:
  grafana-data:
