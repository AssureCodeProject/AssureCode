# =============================================================================
# Nginx site config for the SPA under docker-compose.
#
# Same as infra/docker/nginx.conf, plus the API proxy. The two differ because
# the deployments differ: in Kubernetes the Ingress
# (infra/k8s/06-frontend-ingress.yaml) routes /api, /auth and /webhooks to the
# api-gateway Service, so the frontend image must NOT proxy — nginx.conf
# explains why a static upstream there turned a backend outage into a frontend
# crash-loop. Compose has no ingress, and the SPA calls relative paths
# (apps/web/src/utils/api.js), so something on this origin has to forward them.
#
# This file is bind-mounted over the image's default config by the `web`
# service in docker-compose.yml, so the published image is unchanged.
#
# The proxy uses the exact pattern nginx.conf recommends for this case: Docker's
# embedded DNS as an explicit resolver plus a *variable* upstream, so the name is
# resolved per request instead of at config load. That is what keeps nginx
# starting when the gateway is not up yet — with a literal `proxy_pass
# http://api-gateway:4000` nginx exits 1 with "host not found in upstream" and
# the UI is down because the API is down.
# =============================================================================

# $connection_upgrade is not a built-in — it has to be derived from the request,
# and it must be "close" (not "upgrade") for ordinary requests or every plain
# HTTP call through the proxy carries a bogus upgrade header. conf.d files are
# included at http level, which is the scope `map` requires.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    resolver 127.0.0.11 valid=30s ipv6=off;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location /api/ {
        set $gateway_upstream http://api-gateway:4000;
        proxy_pass $gateway_upstream$request_uri;
        include /etc/nginx/proxy_params.conf;
    }

    location /auth/ {
        set $gateway_upstream http://api-gateway:4000;
        proxy_pass $gateway_upstream$request_uri;
        include /etc/nginx/proxy_params.conf;
    }

    location /webhooks/ {
        set $gateway_upstream http://api-gateway:4000;
        proxy_pass $gateway_upstream$request_uri;
        include /etc/nginx/proxy_params.conf;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
