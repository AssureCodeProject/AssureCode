# =============================================================================
# Nginx site config for the built Vite SPA.
#
# Was previously generated by a multi-line `echo` inside Dockerfile.web, where
# every line needed a trailing backslash and nginx variables like $uri had to
# survive shell expansion. A real file is easier to get right and can be
# linted; it also lets `listen` change without editing a shell string.
#
# Port 8080, not 80: the image is nginx-unprivileged, which runs as uid 101
# and cannot bind a privileged port.
# =============================================================================
server {
    listen 8080;
    server_name _;

    # Endpoint for the Kubernetes probes. Returns without touching the
    # filesystem, so it stays up even if the SPA bundle is missing — which is
    # what makes it a liveness signal for nginx itself rather than for the
    # build output.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location / {
        root /usr/share/nginx/html;
        # SPA routing: unknown paths are client-side routes, not 404s.
        try_files $uri $uri/ /index.html;
    }
}

# ── Why there is no /api proxy here ──────────────────────────────────────
# This config used to proxy /api/ to http://api-gateway:4000. Two problems
# with that, both real:
#
#   1. nginx resolves a statically-named upstream at config-load time and
#      refuses to start if it does not resolve — "host not found in upstream".
#      So the frontend pod crash-looped whenever the gateway Service was not
#      yet up, making a backend outage into a frontend outage. Verified by
#      running the image standalone: nginx exits 1 before serving anything.
#
#   2. It was redundant. The Ingress (infra/k8s/06-frontend-ingress.yaml)
#      already routes /api, /auth and /webhooks straight to the api-gateway
#      Service, so in Kubernetes this block never saw a request — it only
#      ever added a startup dependency.
#
# Local development does not need it either: `npm run dev:web` serves through
# Vite on :3000, which has its own proxy for /api, /auth and /webhooks
# (apps/web/vite.config.js). Nothing in docker-compose.yml runs this image.
#
# If you ever do need the image to front the API standalone, use a resolver
# and a variable so lookup happens per-request rather than at startup:
#
#     resolver 127.0.0.11 valid=30s;          # Docker's embedded DNS
#     set $gateway http://api-gateway:4000;
#     proxy_pass $gateway;
