# Shared proxy headers for the compose frontend's /api, /auth and /webhooks
# locations. Bind-mounted alongside nginx.compose.conf.
#
# The Upgrade/Connection pair is load-bearing, not boilerplate: the gateway
# serves two WebSocket streams (/api/audits/:id/stream and
# /api/contracts/:id/chat/stream) that the Phase-2 dashboard and the scope-guard
# chat panel both depend on. Without these headers nginx strips the upgrade and
# the browser sees the handshake fail, which presents as a stepper that never
# advances rather than as a proxy error.
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# WebSocket connections are long-lived and mostly idle; the 60s default closes
# an audit stream that is waiting on a slow sandbox run.
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
