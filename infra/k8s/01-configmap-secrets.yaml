apiVersion: v1
kind: ConfigMap
metadata:
  name: assurecode-config
  namespace: assurecode
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  GATEWAY_PORT: "4000"
  AI_SERVICE_PORT: "8000"
  SCOPE_GUARD_PORT: "8001"
  EMBED_PROVIDER: "sentence-transformers"
  EMBED_MODEL_NAME: "all-MiniLM-L6-v2"
  LLM_PROVIDER: "cloudflare"
---
apiVersion: v1
kind: Secret
metadata:
  name: assurecode-secrets
  namespace: assurecode
type: Opaque
stringData:
  DATABASE_URL: "postgresql://assurecode:assurecode_local_dev@postgres.assurecode.svc.cluster.local:5432/assurecode"
  REDIS_URL: "redis://redis.assurecode.svc.cluster.local:6379"
  JWT_SECRET: "production_jwt_secret_assurecode_key_2026"
  STRIPE_SECRET_KEY: "sk_test_mock"
  STRIPE_WEBHOOK_SECRET: "whsec_mock"
