# =============================================================================
# Non-secret configuration + a placeholder Secret.
#
# The Secret below deliberately contains NO real values. It exists so that
# `kubectl apply -f infra/k8s/` produces a complete, schema-valid set of
# objects (and so the CI dry-run keeps working) — not so that it can be
# deployed as-is. Every value is `REPLACE_ME`, and packages/config rejects
# that literal at boot, so a cluster running this file fails fast and loudly
# instead of coming up with a known-public credential.
#
# For a real deployment, do NOT edit this file with live values — it is
# tracked in git. Use one of:
#
#   • External Secrets Operator — see infra/k8s/overlays/external-secrets/.
#     Applied after the base, its ExternalSecret overwrites the placeholder
#     Secret with values pulled from your backing store.
#
#   • Sealed Secrets — see infra/k8s/overlays/sealed-secrets/README.md for
#     the kubeseal command that generates an encrypted, commit-safe manifest.
#
#   • A local untracked override for scratch clusters:
#     copy 01-secrets.example.yaml to 01-secrets.local.yaml (gitignored),
#     fill it in, and apply it after the base.
#
# History note: an earlier revision of this file carried a live-looking
# JWT_SECRET and database credentials in plaintext. They are removed here and
# must be treated as burned — rotate anything that was ever derived from them.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: assurecode-config
  namespace: assurecode
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  GATEWAY_PORT: "4000"
  AI_SERVICE_PORT: "8000"
  SCOPE_GUARD_PORT: "8001"
  WEBHOOK_INGEST_PORT: "9000"
  # In-cluster service addresses. The *_PORT vars above are what each service
  # binds; these are how the others reach it, and the two are not interchangeable
  # — a URL derived from a port alone resolves to the caller's own pod. Without
  # these entries every cross-service call falls back to the localhost defaults
  # in packages/config, which in Kubernetes means matchmaking, test generation,
  # RAG ingest, XAI scoring and both scope-guard calls all silently fail.
  AI_SERVICE_URL: "http://ai-service:8000"
  SCOPE_GUARD_URL: "http://scope-guard:8001"
  GATEWAY_URL: "http://api-gateway:4000"
  # Scope decision threshold. Measured by tools/calibrate_scope_threshold.py
  # against infra/calibration/scope_threshold_corpus.json, reported on a
  # held-out contract split. Re-run it if EMBED_MODEL_NAME changes: similarity
  # scales are model-specific, so a threshold from another model is meaningless.
  SCOPE_SIMILARITY_THRESHOLD: "0.3056"
  # Residuals the conformal drift detector computes p-values against. Unset
  # means GET /scope/drift/{id} is a 503 for every contract. The file is baked
  # into the scope-guard image; the path is relative to the repo root (/srv).
  #
  # SYNTHETIC=1 marks these as random floats rather than measured residuals and
  # carries that fact into the drift response and the ledger record. It stays 1
  # until a real T2 set clears the kappa gate in configs/c1_rules.json.
  SCOPE_DRIFT_CALIBRATION_PATH: "infra/calibration/scope_drift_synthetic_t2.json"
  SCOPE_DRIFT_CALIBRATION_SYNTHETIC: "1"
  # Matchmaking graph backend: "postgres" (pgvector + HNSW) or "neo4j" (native
  # vector index). Switching to neo4j additionally requires
  # infra/k8s/16-seed-neo4j-job.yaml to have run — without the vector index the
  # adapter degrades to a hardcoded in-process fixture and the cluster looks
  # healthy while serving fixture data.
  GRAPH_BACKEND: "postgres"
  # Event bus transport: "redis" (Redis Streams, the default) or "kafka".
  # Switching to kafka requires infra/k8s/17-kafka.yaml to be applied — with no
  # broker reachable, KafkaBus's publishes reject rather than silently drop, so
  # the failure is loud, but it is still a failure. KAFKA_BROKERS names the
  # StatefulSet's stable per-pod DNS, not the headless Service: a Service name
  # round-robins, and a Kafka client needs to reach one specific broker.
  EVENT_BUS_TYPE: "redis"
  KAFKA_BROKERS: "kafka-0.kafka.assurecode.svc.cluster.local:29092"
  # Read by KafkaBus.ensureTopics() when it creates a topic. Three partitions
  # so a consumer group can scale to three workers; replication 1 because
  # 17-kafka.yaml runs a single broker and a higher factor would leave every
  # topic under-replicated and unwritable.
  KAFKA_TOPIC_PARTITIONS: "3"
  KAFKA_TOPIC_REPLICATION: "1"
  EMBED_PROVIDER: "sentence-transformers"
  EMBED_MODEL_NAME: "all-MiniLM-L6-v2"
  LLM_PROVIDER: "cloudflare"
  # Artifacts must land in object storage, never on a pod's ephemeral disk —
  # see apps/ai-service/app/ports/artifact_store.py. With the fallback off, the
  # bucket settings below are load-bearing rather than advisory: ai-service
  # cannot store a test bundle at all if they are wrong.
  ALLOW_LOCAL_ARTIFACT_FALLBACK: "false"
  # Must be set for the target cluster — omitting it does NOT fall back to real
  # AWS. apps/ai-service/app/settings.py:91 defaults S3_ENDPOINT to
  # http://localhost:4566 (LocalStack), and deps.py:94 hands that to boto3
  # verbatim, so an unset value points every pod at its own loopback. Replace
  # with the cluster's S3-compatible endpoint, or with the regional AWS endpoint
  # (https://s3.<region>.amazonaws.com) when using S3 proper.
  S3_ENDPOINT: "REPLACE_ME"
  S3_BUCKET_NAME: "assurecode-artifacts"
  AWS_REGION: "us-east-1"
  # Razorpay's key id is public — it is served to the browser so Checkout can
  # open — so it belongs here rather than in the Secret. The key secret and the
  # webhook secret do not; they are in assurecode-secrets below.
  RAZORPAY_KEY_ID: "REPLACE_ME"
  # Public base URL of the web app. Used to build KYC and payout-onboarding
  # return URLs, which the user's browser follows — so this must be the address
  # the browser can reach, not an in-cluster service name.
  WEB_APP_URL: "REPLACE_ME"
  # CORS allow-list, comma-separated. Read by apps/api-gateway. Unset in
  # production it falls back to a single hardcoded hostname
  # (https://app.assurecode.io), so any other front-end origin is refused with
  # no indication that the cause is configuration rather than code.
  ALLOWED_ORIGINS: "REPLACE_ME"
  # OTLP span destination for packages/telemetry. The default is
  # http://localhost:4317, which in a pod is that pod's own loopback — every
  # service exports its traces into a socket nothing is listening on and the
  # instrumentation produces no observable output at all. Point this at the
  # collector's in-cluster address once one is deployed; see
  # infra/docker-compose.yml for the local equivalent.
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  # Which sandbox ci-worker runs untrusted code in. Pinned to "node" here to
  # match the reasoning in 07-ci-worker.yaml: the Docker runner needs the
  # Docker socket mounted, which hands a code-execution workload the node's
  # container runtime. This is weaker isolation and is a documented trade-off.
  SANDBOX_RUNNER: "node"
  # Whether ci-worker fetches the pushed commit's source from the GitHub API.
  # Off means a real push webhook is refused with an explanation instead of
  # being audited against code that was not pushed; only the gateway's
  # /simulate-push, which carries code inline, reaches the pipeline. Turning it
  # on also requires the port-443 egress rule in 14-network-policies.yaml and,
  # for private repositories, GITHUB_TOKEN in the Secret below.
  ENABLE_GITHUB_SOURCE_FETCH: "false"
  # Rate limiting (plan2.md task 8.5). Global bucket exempts the health,
  # readiness and metrics endpoints so probes and Prometheus scrapes are never
  # throttled; the login bucket is separate and much tighter.
  RATE_LIMIT_MAX: "300"
  RATE_LIMIT_WINDOW: "1 minute"
  RATE_LIMIT_LOGIN_MAX: "10"
---
apiVersion: v1
kind: Secret
metadata:
  name: assurecode-secrets
  namespace: assurecode
  annotations:
    assurecode.io/placeholder: "true"
    assurecode.io/replace-with: "external-secrets | sealed-secrets | 01-secrets.local.yaml"
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_ME"
  REDIS_URL: "REPLACE_ME"
  NEO4J_URI: "REPLACE_ME"
  NEO4J_PASSWORD: "REPLACE_ME"
  JWT_SECRET: "REPLACE_ME"
  SERVICE_TOKEN: "REPLACE_ME"
  GITHUB_WEBHOOK_SECRET: "REPLACE_ME"
  # Read scope on the contract repositories, used by ci-worker to fetch a
  # pushed commit's source. Only required for private repositories — public
  # ones work unauthenticated, but at 60 requests/hour/IP shared across every
  # replica, which one audit can exhaust. Distinct from the webhook secret
  # above: that one only verifies inbound deliveries.
  GITHUB_TOKEN: "REPLACE_ME"
  ML_DSA_SEED_HEX: "REPLACE_ME"
  # Razorpay. The key *secret* signs API calls and the checkout callback; the
  # webhook secret is a separate value set in the Razorpay dashboard and signs
  # webhook bodies only. The key *id* is public and lives in the ConfigMap
  # above, because it is served to the browser.
  RAZORPAY_KEY_SECRET: "REPLACE_ME"
  RAZORPAY_WEBHOOK_SECRET: "REPLACE_ME"
  # Cloudflare Workers AI — the only LLM provider (LLM_PROVIDER above).
  # Load-bearing rather than optional: with the Gemini and OpenAI adapters gone
  # there is no fallback, so ai-service raises LlmUnavailableError on the first
  # test generation, security-scan LLM layer, or XAI judge call if these are
  # unset. The account id is not secret, but it is useless without the token and
  # they are rotated together, so both live here.
  CLOUDFLARE_ACCOUNT_ID: "REPLACE_ME"
  CLOUDFLARE_API_TOKEN: "REPLACE_ME"
