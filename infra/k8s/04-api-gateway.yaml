apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway
  namespace: assurecode
# The gateway never calls the Kubernetes API. Giving it a dedicated identity
# with no RoleBinding, and no mounted token, means a compromised request
# handler cannot reach the control plane using the namespace default.
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: assurecode
  labels:
    app: api-gateway
spec:
  # Matches the HPA's minReplicas in 13-autoscaling.yaml. If you change one,
  # change both — otherwise the first HPA reconcile silently overrides this.
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      serviceAccountName: api-gateway
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-gateway
          image: assurecode/api-gateway:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # PDF extraction writes scratch files, so the root filesystem
            # cannot be read-only without a writable /tmp mount; left false
            # rather than adding a volume the request path may not need.
            readOnlyRootFilesystem: false
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: assurecode-config
            - secretRef:
                name: assurecode-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: assurecode
spec:
  type: ClusterIP
  ports:
    - port: 4000
      targetPort: 4000
  selector:
    app: api-gateway
