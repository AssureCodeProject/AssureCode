# =============================================================================
# Neo4j 5 — the freelancer/contract relationship graph.
#
# Read and written only by ai-service (apps/ai-service/app/ports/graph_repo.py)
# and seeded by tools/seed-neo4j.ts. Nothing else in the system depends on it,
# so a Neo4j outage degrades matchmaking rather than stopping contracts.
#
# ── Prefer a managed instance ────────────────────────────────────────────
# Single community-edition replica: no clustering, no automated backup.
# For production use AuraDB and point NEO4J_URI at it; this file can then be
# deleted with no other manifest changes.
#
# The community image accepts a single auth pair via NEO4J_AUTH in the form
# `user/password`, which is why the password is assembled into that shape
# below rather than passed as its own variable.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: assurecode
  labels:
    app: neo4j
spec:
  clusterIP: None
  ports:
    - port: 7687
      targetPort: 7687
      name: bolt
    - port: 7474
      targetPort: 7474
      name: http
  selector:
    app: neo4j
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  namespace: assurecode
spec:
  serviceName: neo4j
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      securityContext:
        fsGroup: 7474
      containers:
        - name: neo4j
          image: neo4j:5-community
          ports:
            - containerPort: 7687
              name: bolt
            - containerPort: 7474
              name: http
          env:
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: assurecode-secrets
                  key: NEO4J_PASSWORD
                  optional: true
            - name: NEO4J_AUTH
              value: "neo4j/$(NEO4J_PASSWORD)"
            # Community edition caps at one database; accepting the licence
            # is required for the image to start unattended.
            - name: NEO4J_ACCEPT_LICENSE_AGREEMENT
              value: "yes"
            - name: NEO4J_server_memory_heap_max__size
              value: "1G"
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          readinessProbe:
            tcpSocket:
              port: 7687
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 7687
            initialDelaySeconds: 60
            periodSeconds: 20
          # Neo4j is slow to open the Bolt port on a cold volume. Without a
          # startup probe the liveness probe would kill it mid-initialisation
          # and the pod would crash-loop forever.
          startupProbe:
            tcpSocket:
              port: 7687
            failureThreshold: 30
            periodSeconds: 10
          volumeMounts:
            - name: neo4j-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: neo4j-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
