apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-web
  namespace: assurecode
  labels:
    app: frontend-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-web
  template:
    metadata:
      labels:
        app: frontend-web
    spec:
      securityContext:
        # uid 101 is the nginx user in nginxinc/nginx-unprivileged, which is
        # why the container listens on 8080 rather than the privileged 80.
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend-web
          image: assurecode/frontend-web:latest
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # /healthz is served by nginx itself (infra/docker/nginx.conf) and
          # does not read from disk, so it reports whether the server is up
          # rather than whether the SPA bundle happens to be present.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-web
  namespace: assurecode
spec:
  type: ClusterIP
  ports:
    # The Service still answers on 80; only the container port moved.
    - port: 80
      targetPort: 8080
  selector:
    app: frontend-web
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: assurecode-ingress
  namespace: assurecode
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - app.assurecode.io
      secretName: assurecode-tls
  rules:
    - host: app.assurecode.io
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 4000
          # /auth was missing. The gateway serves /auth/login, /auth/logout
          # and /auth/me (server.ts:301-390) and the SPA calls all three via
          # AuthContext — without this rule they fell through to the `/` rule
          # and were answered by nginx with index.html, so signing in was
          # impossible through the Ingress. Vite's dev proxy has always
          # forwarded /auth, which is why this only broke in the cluster.
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 4000
          # Razorpay posts to /webhooks/razorpay on the gateway. Same failure
          # mode: routed to the SPA, so signature verification never ran.
          # (GitHub's webhook goes to the separate webhook-ingest Service,
          # which needs its own host or path rule once a domain exists.)
          - path: /webhooks
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-web
                port:
                  number: 80
