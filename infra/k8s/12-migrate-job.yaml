# =============================================================================
# Schema migration Job.
#
# Runs tools/migrate.ts against the database before the application rollout.
# The CI pipeline currently invokes that script as a bare step
# (.github/workflows/production-ci-cd.yml); this is the in-cluster equivalent,
# so a deploy cannot start pods that expect a table the database has not been
# given yet.
#
# ── Ordering ─────────────────────────────────────────────────────────────
# The helm.sh/hook annotations make this a pre-install/pre-upgrade hook if the
# manifests are ever wrapped in a chart. Under plain `kubectl apply -f`, there
# is no ordering primitive — apply this file and wait for completion before
# applying the workloads:
#
#     kubectl apply -f infra/k8s/12-migrate-job.yaml
#     kubectl wait --for=condition=complete job/assurecode-migrate \
#         -n assurecode --timeout=300s
#     kubectl apply -f infra/k8s/
#
# ── Idempotency ──────────────────────────────────────────────────────────
# Every migration in infra/migrations/postgres is written with
# `CREATE TABLE IF NOT EXISTS` / `DROP CONSTRAINT IF EXISTS`, so re-running
# the job is safe. That is what makes `backoffLimit` meaningful rather than
# dangerous: a retry after a transient database outage re-applies cleanly.
#
# The job name is fixed, so a redeploy needs the previous one removed first
# (`kubectl delete job assurecode-migrate -n assurecode`). ttlSecondsAfter-
# Finished handles that automatically on clusters with the TTL controller on.
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: assurecode-migrate
  namespace: assurecode
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  # Clean the completed Job up an hour later so the next deploy does not trip
  # over an immutable leftover.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: assurecode-migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          # A dedicated image, not the gateway's. The gateway image copies
          # only packages/ and apps/api-gateway/, so it carries neither
          # tools/migrate.ts nor infra/migrations/*.sql — and pruning dev
          # dependencies from it would remove tsx, which is the entrypoint.
          # See infra/docker/Dockerfile.migrate.
          image: assurecode/migrate:latest
          envFrom:
            - configMapRef:
                name: assurecode-config
            - secretRef:
                name: assurecode-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
