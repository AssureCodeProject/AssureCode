# =============================================================================
# Observability: OTel Collector, Jaeger, Prometheus, Grafana.
#
# Without these, 01-configmap-secrets.yaml sets OTEL_EXPORTER_OTLP_ENDPOINT to
# http://otel-collector:4317 and that name resolves to nothing — every service
# exports its spans into a closed socket. packages/telemetry has always produced
# real spans and metrics; what was missing in-cluster was anything to receive
# them. This file supplies the receivers.
#
# Scope and posture
# -----------------
# This is a self-contained, in-cluster tier suitable for a research deployment
# and a demo. It is deliberately NOT production observability:
#
#   * Jaeger runs all-in-one with in-memory storage. Traces are lost on restart
#     and the pod is a single point of failure. Sized for "look at a trace during
#     a demo", not for retention.
#   * Prometheus keeps 7 days on a single 10Gi volume with no remote write and
#     no alertmanager. There are no alerting rules — plan2.md task 7.6 is open.
#   * Grafana allows anonymous viewers so a dashboard can be opened and
#     screenshotted without provisioning accounts. Behind the Ingress this is
#     readable by anyone who reaches it; do not expose it publicly as-is.
#
# For anything real, point OTEL_EXPORTER_OTLP_ENDPOINT at a managed collector
# and delete this file rather than hardening it in place.
#
# The security posture matches the rest of infra/k8s: non-root, all capabilities
# dropped, no privilege escalation, RuntimeDefault seccomp, no automounted
# service-account token, requests and limits on every container.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: observability
  namespace: assurecode
automountServiceAccountToken: false
---
# ── OTel Collector configuration ─────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: assurecode
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      # Without a memory limiter a burst of spans during a load run can OOM-kill
      # the collector, which then looks like a service outage in the traces.
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 100
      batch:
        timeout: 5s
        send_batch_size: 512
    exporters:
      otlp/jaeger:
        endpoint: jaeger:4317
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/jaeger]
---
# ── Prometheus scrape configuration ──────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: assurecode
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
      # All four instrumented services. The Node pair use packages/telemetry
      # (prom-client); the Python pair use app/ports/telemetry.py
      # (prometheus_client), sharing the assurecode_* metric-name prefix so a
      # dashboard can sum a family across both tiers.
      - job_name: api-gateway
        metrics_path: /metrics
        static_configs:
          - targets: ["api-gateway:4000"]
            labels: { service: api-gateway }
      - job_name: webhook-ingest
        metrics_path: /metrics
        static_configs:
          - targets: ["webhook-ingest:9000"]
            labels: { service: webhook-ingest }
      - job_name: ai-service
        metrics_path: /metrics
        static_configs:
          - targets: ["ai-service:8000"]
            labels: { service: ai-service }
      - job_name: scope-guard
        metrics_path: /metrics
        static_configs:
          - targets: ["scope-guard:8001"]
            labels: { service: scope-guard }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: assurecode
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
      - name: Jaeger
        type: jaeger
        access: proxy
        url: http://jaeger:16686
        editable: false
---
# ── OTel Collector ───────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: assurecode
spec:
  type: ClusterIP
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
  selector:
    app: otel-collector
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: assurecode
  labels:
    app: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      serviceAccountName: observability
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.115.1
          args: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - containerPort: 4317
            - containerPort: 4318
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              # Above the collector's own limit_mib: 400 so the processor sheds
              # load before the kubelet OOM-kills the container.
              memory: "512Mi"
          # The collector exposes no HTTP health route on the OTLP ports, so the
          # probe is a TCP connect to the gRPC receiver: it proves the receiver
          # is accepting connections, which is the failure that matters here (a
          # collector that stops accepting silently drops every service's spans).
          livenessProbe:
            tcpSocket:
              port: 4317
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
# ── Jaeger ───────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: assurecode
spec:
  type: ClusterIP
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: ui
      port: 16686
      targetPort: 16686
  selector:
    app: jaeger
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: assurecode
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      serviceAccountName: observability
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62.0
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
            # In-memory storage. Traces do not survive a restart — see the
            # header. Capped so a trace flood cannot consume the memory limit.
            - name: MEMORY_MAX_TRACES
              value: "50000"
          ports:
            - containerPort: 4317
            - containerPort: 16686
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 10
            periodSeconds: 30
---
# ── Prometheus ───────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: assurecode
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9090
      targetPort: 9090
  selector:
    app: prometheus
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: assurecode
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: assurecode
  labels:
    app: prometheus
spec:
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: the PVC is ReadWriteOnce, so a second pod
    # would block indefinitely waiting for a volume the first still holds.
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: observability
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 15
          # /-/healthy, not /-/ready: readiness goes false while the TSDB
          # replays its WAL after a restart, and a liveness probe on that would
          # kill the pod mid-replay and loop forever.
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
# ── Grafana ──────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: assurecode
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  selector:
    app: grafana
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: assurecode
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      serviceAccountName: observability
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana:11.3.1
          env:
            # Anonymous viewer access — see the header. Readable by anyone who
            # can reach the Service.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Viewer"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: assurecode-secrets
                  key: GRAFANA_ADMIN_PASSWORD
                  optional: true
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
