# =============================================================================
# Observability: OTel Collector, Jaeger, Prometheus, Grafana.
#
# Without these, 01-configmap-secrets.yaml sets OTEL_EXPORTER_OTLP_ENDPOINT to
# http://otel-collector:4317 and that name resolves to nothing — every service
# exports its spans into a closed socket. packages/telemetry has always produced
# real spans and metrics; what was missing in-cluster was anything to receive
# them. This file supplies the receivers.
#
# Scope and posture
# -----------------
# This is a self-contained, in-cluster tier suitable for a research deployment
# and a demo. It is deliberately NOT production observability:
#
#   * Jaeger runs all-in-one with in-memory storage. Traces are lost on restart
#     and the pod is a single point of failure. Sized for "look at a trace during
#     a demo", not for retention.
#   * Prometheus keeps 7 days on a single 10Gi volume with no remote write and
#     no alertmanager. There are no alerting rules — plan2.md task 7.6 is open.
#   * Grafana allows anonymous viewers so a dashboard can be opened and
#     screenshotted without provisioning accounts. Behind the Ingress this is
#     readable by anyone who reaches it; do not expose it publicly as-is.
#
# For anything real, point OTEL_EXPORTER_OTLP_ENDPOINT at a managed collector
# and delete this file rather than hardening it in place.
#
# The security posture matches the rest of infra/k8s: non-root, all capabilities
# dropped, no privilege escalation, RuntimeDefault seccomp, no automounted
# service-account token, requests and limits on every container.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: observability
  namespace: assurecode
automountServiceAccountToken: false
---
# ── OTel Collector configuration ─────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: assurecode
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      # Without a memory limiter a burst of spans during a load run can OOM-kill
      # the collector, which then looks like a service outage in the traces.
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 100
      batch:
        timeout: 5s
        send_batch_size: 512
    exporters:
      otlp/jaeger:
        endpoint: jaeger:4317
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/jaeger]
---
# ── Prometheus scrape configuration ──────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: assurecode
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    # Mirrors infra/observability/prometheus.yml. No Alertmanager is deployed,
    # so these evaluate into Prometheus's own Alerts tab rather than paging.
    rule_files:
      - /etc/prometheus/rules/alert-rules.yml
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
      # All four instrumented services. The Node pair use packages/telemetry
      # (prom-client); the Python pair use app/ports/telemetry.py
      # (prometheus_client), sharing the assurecode_* metric-name prefix so a
      # dashboard can sum a family across both tiers.
      - job_name: api-gateway
        metrics_path: /metrics
        static_configs:
          - targets: ["api-gateway:4000"]
            labels: { service: api-gateway }
      - job_name: webhook-ingest
        metrics_path: /metrics
        static_configs:
          - targets: ["webhook-ingest:9000"]
            labels: { service: webhook-ingest }
      - job_name: ai-service
        metrics_path: /metrics
        static_configs:
          - targets: ["ai-service:8000"]
            labels: { service: ai-service }
      - job_name: scope-guard
        metrics_path: /metrics
        static_configs:
          - targets: ["scope-guard:8001"]
            labels: { service: scope-guard }
      # Server-level Redis metrics via the redis-exporter sidecar in
      # 03-redis.yaml — same reasoning as infra/observability/prometheus.yml.
      - job_name: redis
        static_configs:
          - targets: ["redis:9121"]
            labels: { service: redis }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: assurecode
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
      - name: Jaeger
        type: jaeger
        access: proxy
        url: http://jaeger:16686
        editable: false
---
# ── OTel Collector ───────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: assurecode
spec:
  type: ClusterIP
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
  selector:
    app: otel-collector
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: assurecode
  labels:
    app: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      serviceAccountName: observability
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.115.1
          args: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - containerPort: 4317
            - containerPort: 4318
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              # Above the collector's own limit_mib: 400 so the processor sheds
              # load before the kubelet OOM-kills the container.
              memory: "512Mi"
          # The collector exposes no HTTP health route on the OTLP ports, so the
          # probe is a TCP connect to the gRPC receiver: it proves the receiver
          # is accepting connections, which is the failure that matters here (a
          # collector that stops accepting silently drops every service's spans).
          livenessProbe:
            tcpSocket:
              port: 4317
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
# ── Jaeger ───────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: assurecode
spec:
  type: ClusterIP
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: ui
      port: 16686
      targetPort: 16686
  selector:
    app: jaeger
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: assurecode
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      serviceAccountName: observability
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62.0
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
            # In-memory storage. Traces do not survive a restart — see the
            # header. Capped so a trace flood cannot consume the memory limit.
            - name: MEMORY_MAX_TRACES
              value: "50000"
          ports:
            - containerPort: 4317
            - containerPort: 16686
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 10
            periodSeconds: 30
---
# ── Prometheus ───────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: assurecode
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9090
      targetPort: 9090
  selector:
    app: prometheus
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: assurecode
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: assurecode
  labels:
    app: prometheus
spec:
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: the PVC is ReadWriteOnce, so a second pod
    # would block indefinitely waiting for a volume the first still holds.
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: observability
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            # Separate mount: /etc/prometheus is a ConfigMap mount, so writing
            # a second key into it is not possible without replacing the first.
            - name: rules
              mountPath: /etc/prometheus/rules
              readOnly: true
            - name: data
              mountPath: /prometheus
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 15
          # /-/healthy, not /-/ready: readiness goes false while the TSDB
          # replays its WAL after a restart, and a liveness probe on that would
          # kill the pod mid-replay and loop forever.
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
# ── Grafana ──────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: assurecode
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  selector:
    app: grafana
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: assurecode
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      serviceAccountName: observability
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana:11.3.1
          env:
            # Anonymous viewer access — see the header. Readable by anyone who
            # can reach the Service.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Viewer"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: assurecode-secrets
                  key: GRAFANA_ADMIN_PASSWORD
                  optional: true
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            # Two mounts at deliberately different paths: the provider file
            # lives in provisioning/dashboards and points Grafana at
            # /etc/assurecode/dashboards for the JSON. Mounting both at the same
            # path would have them shadow each other.
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /etc/assurecode/dashboards
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
# Alerting rules, kept in step with infra/observability/alert-rules.yml so the
# compose stack and the cluster evaluate the same conditions.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: assurecode
data:
  alert-rules.yml: |
    # Prometheus alerting rules.
    #
    # Every rule here fires on a metric that already exists and is already scraped —
    # none of them needed new instrumentation. That is the reason they are the first
    # rules in the repository: before this there was no `rule_files:` stanza at all,
    # so a poison message could sit in a DLQ indefinitely with a counter faithfully
    # recording it and nobody looking.
    #
    # There is no Alertmanager deployed yet, so these evaluate and show up in
    # Prometheus's own Alerts tab rather than paging anyone. That is still strictly
    # better than a metric nobody queries: the state is named, has a threshold
    # somebody chose, and carries the reason in the annotation.
    #
    # Deliberately few. A starting set that is all true positives is worth more than
    # a comprehensive set that trains people to ignore the tab.

    groups:
      - name: assurecode-delivery
        interval: 30s
        rules:
          # A message reaches the DLQ only after the bus has already retried it, so
          # any value above zero means a payload was dropped from the pipeline —
          # an audit that never scored, or a settlement request that never ran.
          # `> 0` rather than a rate: one lost settlement is worth knowing about.
          - alert: DeadLetterQueueNotEmpty
            expr: increase(assurecode_dlq_messages_total[15m]) > 0
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: "Messages are being dead-lettered on {{ $labels.stream }}"
              description: >-
                {{ $value | printf "%.0f" }} message(s) moved to {{ $labels.stream }}.dlq in the
                last 15 minutes. The bus retried each one and gave up. Nothing drains
                the DLQ automatically, so these events are lost until someone replays
                them. Check the consumer's logs for the handler that threw.

          # Consumer lag is the difference between when an event was published and
          # when a handler picked it up. Sustained lag means a worker is falling
          # behind or has stopped consuming without crashing — the failure mode a
          # liveness probe cannot see.
          - alert: EventConsumerLagHigh
            expr: histogram_quantile(0.95, sum by (le, topic) (rate(assurecode_event_lag_seconds_bucket[5m]))) > 60
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "p95 consumer lag on {{ $labels.topic }} is above 60s"
              description: >-
                Events on {{ $labels.topic }} are taking over a minute to be consumed at
                p95, sustained for 10 minutes. A worker is behind or wedged. Note that
                settlement-worker holds the AUDIT_COMPLETED handler open while it
                triggers scoring, so a degraded gateway shows up here first.

      - name: assurecode-availability
        interval: 30s
        rules:
          # The cheapest alert in the file and the one most likely to fire first.
          # A service that stops being scraped is invisible to every other rule
          # here, so this has to exist or the rest silently stop meaning anything.
          - alert: ServiceDown
            expr: up == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "{{ $labels.job }} has not been scrapeable for 2 minutes"
              description: >-
                Prometheus cannot reach {{ $labels.instance }}. Every other alert that
                depends on this target is now blind, not quiet.

          # ci-worker and settlement-worker expose no /metrics at all, so they are
          # absent from `up` entirely and this rule cannot cover them. Recorded here
          # rather than left as a surprise: see ARCHITECTURE.md, and the compose
          # healthchecks are currently the only signal those two produce.

      - name: assurecode-dependencies
        interval: 30s
        rules:
          # Cloudflare is the only LLM provider. When it is unreachable, the OWASP
          # Layer 2 scan cannot run, and ci-worker correctly refuses to call a
          # half-completed scan a pass — which means securityPassed stays false and
          # nothing can settle. That chain is not obvious from the symptom, so the
          # annotation states it.
          - alert: LlmProviderFailing
            expr: >-
              sum(rate(assurecode_llm_calls_total{outcome!="ok"}[10m]))
              / clamp_min(sum(rate(assurecode_llm_calls_total[10m])), 0.001) > 0.5
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: "Over half of LLM calls are failing"
              description: >-
                The LLM provider is failing more than 50% of calls over 10 minutes.
                Consequence: the OWASP Layer 2 scan cannot complete, ci-worker reports
                securityScanComplete=false, and the oracle's securityPassed signal is
                permanently false — so no contract can settle until this recovers.

          # The scope guard has measured 100% precision and 60% recall: it does not
          # let out-of-scope work through, it blocks legitimate requests. A sudden
          # jump in block rate is therefore much more likely to be a broken
          # embedding path or a bad threshold than a wave of scope violations.
          - alert: ScopeGuardBlockingMostRequests
            expr: >-
              sum(rate(assurecode_scope_decisions_total{allowed="false"}[15m]))
              / clamp_min(sum(rate(assurecode_scope_decisions_total[15m])), 0.001) > 0.8
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "scope-guard is blocking over 80% of requests"
              description: >-
                Sustained block rate above 80%. Given the guard's measured behaviour
                (100% precision, 60% recall — it over-blocks rather than under-blocks),
                suspect the retrieval path or the similarity threshold before
                suspecting the requests.
---
# Tells Grafana where to find dashboard JSON. Mirrors
# infra/observability/grafana-dashboards.yml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: assurecode
data:
  dashboards.yml: |
    # Grafana dashboard provisioning.
    #
    # Grafana previously mounted only a datasource provider, so it booted connected
    # to Prometheus and Jaeger with nothing to show. The metrics had existed and
    # been scraped the whole time; there was simply no dashboard to read them —
    # which is why "observability" looked done from the compose file and was not.
    apiVersion: 1

    providers:
      - name: assurecode
        orgId: 1
        folder: AssureCode
        type: file
        disableDeletion: false
        # Picks up edits to the JSON without a restart, so a panel can be iterated
        # on against a running stack.
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          # Deliberately NOT /etc/grafana/provisioning/dashboards — that directory
          # holds this provider file, and mounting the JSON there too would have
          # the two mounts shadow each other.
          path: /etc/assurecode/dashboards
          foldersFromFilesStructure: false
---
# The dashboard itself. Grafana previously had a datasource provider and no
# dashboards at all, so it came up connected to Prometheus with nothing to show.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: assurecode
data:
  pipeline.json: |
    {
      "uid": "assurecode-pipeline",
      "title": "AssureCode — Pipeline",
      "description": "The contract lifecycle as the running system reports it: events moving, the LLM the security scan depends on, the scope guard's block rate, and the sandbox that executes submitted code. Every panel reads a metric that was already being scraped before this dashboard existed.",
      "tags": ["assurecode"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "DS",
            "type": "datasource",
            "query": "prometheus",
            "current": { "text": "Prometheus", "value": "Prometheus" },
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "Delivery",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "collapsed": false
        },
        {
          "type": "stat",
          "title": "Services up",
          "description": "ci-worker and settlement-worker expose no /metrics and are absent from this count entirely — they are not down, they are unmeasured.",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 5, "w": 4, "x": 0, "y": 1 },
          "targets": [{ "expr": "sum(up)", "refId": "A", "legendFormat": "up" }],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "orange", "value": 3 },
                  { "color": "green", "value": 4 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Dead-lettered (1h)",
          "description": "Anything above zero is a payload the bus retried and gave up on. Nothing drains the DLQ automatically, so these are lost until replayed by hand.",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 5, "w": 5, "x": 4, "y": 1 },
          "targets": [
            { "expr": "sum(increase(assurecode_dlq_messages_total[1h])) or vector(0)", "refId": "A", "legendFormat": "messages" }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "background",
            "graphMode": "area",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "Ledger appends / sec",
          "description": "Every state change a contract goes through is an append. A flat line during activity means the ledger write path is stuck.",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 5, "w": 7, "x": 9, "y": 1 },
          "targets": [
            { "expr": "sum by (action_type) (rate(assurecode_ledger_appends_total[5m]))", "refId": "A", "legendFormat": "{{action_type}}" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "ops", "custom": { "lineWidth": 2, "fillOpacity": 8, "showPoints": "never" } },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } }
        },
        {
          "type": "timeseries",
          "title": "Event consumer lag (p95)",
          "description": "Time between publish and handler pickup. settlement-worker holds the AUDIT_COMPLETED handler open while it triggers scoring, so a degraded gateway shows up here before anywhere else.",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 5, "w": 8, "x": 16, "y": 1 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, topic) (rate(assurecode_event_lag_seconds_bucket[5m])))",
              "refId": "A",
              "legendFormat": "{{topic}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "lineWidth": 2, "fillOpacity": 0, "showPoints": "never" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 30 },
                  { "color": "red", "value": 60 }
                ]
              }
            },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } }
        },

        {
          "type": "row",
          "title": "Verification",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 6 },
          "collapsed": false
        },
        {
          "type": "timeseries",
          "title": "Sandbox duration (p50 / p95)",
          "description": "Wall-clock time executing submitted code. The runner label distinguishes the Docker sandbox from the weaker Node permission fallback.",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 7, "w": 8, "x": 0, "y": 7 },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (le, runner) (rate(assurecode_ci_sandbox_duration_seconds_bucket[10m])))",
              "refId": "A",
              "legendFormat": "p50 {{runner}}"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le, runner) (rate(assurecode_ci_sandbox_duration_seconds_bucket[10m])))",
              "refId": "B",
              "legendFormat": "p95 {{runner}}"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "s", "custom": { "lineWidth": 2, "fillOpacity": 0, "showPoints": "never" } },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } }
        },
        {
          "type": "timeseries",
          "title": "LLM call outcomes",
          "description": "Cloudflare is the only provider. When these go non-ok the OWASP Layer 2 scan cannot complete, ci-worker reports securityScanComplete=false, and no contract can settle — the symptom appears three services away from the cause.",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 7, "w": 8, "x": 8, "y": 7 },
          "targets": [
            { "expr": "sum by (outcome) (rate(assurecode_llm_calls_total[5m]))", "refId": "A", "legendFormat": "{{outcome}}" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "ops", "custom": { "lineWidth": 2, "fillOpacity": 20, "stacking": { "mode": "normal" }, "showPoints": "never" } },
            "overrides": [
              { "matcher": { "id": "byName", "options": "ok" }, "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "green" } }] },
              { "matcher": { "id": "byName", "options": "unavailable" }, "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } }] }
            ]
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } }
        },
        {
          "type": "timeseries",
          "title": "Scope decisions",
          "description": "The guard measures 100% precision and 60% recall — it over-blocks rather than under-blocks. A spike in blocked is more likely a broken retrieval path than a wave of violations.",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 7, "w": 8, "x": 16, "y": 7 },
          "targets": [
            { "expr": "sum by (allowed) (rate(assurecode_scope_decisions_total[15m]))", "refId": "A", "legendFormat": "allowed={{allowed}}" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "ops", "custom": { "lineWidth": 2, "fillOpacity": 20, "stacking": { "mode": "normal" }, "showPoints": "never" } },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } }
        },

        {
          "type": "row",
          "title": "Settlement",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 14 },
          "collapsed": false
        },
        {
          "type": "timeseries",
          "title": "Settlement operations",
          "description": "By status. Capture moves money from the client to the platform; there is no payout leg, so a completed settlement here does not mean the freelancer has been paid.",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 15 },
          "targets": [
            { "expr": "sum by (status) (increase(assurecode_settlement_operations_total[1h]))", "refId": "A", "legendFormat": "{{status}}" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short", "custom": { "lineWidth": 2, "fillOpacity": 20, "showPoints": "never" } },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } }
        },
        {
          "type": "timeseries",
          "title": "Escrow captured (INR)",
          "description": "assurecode_settlement_amount_cents_total holds minor units (paise) despite the name, so this divides by 100.",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 15 },
          "targets": [
            { "expr": "sum(increase(assurecode_settlement_amount_cents_total[1h])) / 100", "refId": "A", "legendFormat": "INR/hour" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "currencyINR", "custom": { "lineWidth": 2, "fillOpacity": 10, "showPoints": "never" } },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "single" } }
        }
      ]
    }
