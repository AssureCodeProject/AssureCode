# =============================================================================
# Kafka 3.8 (KRaft) — the alternative event bus transport.
#
# Redis Streams is the default and remains so; this exists because
# packages/event-bus ships a KafkaBus that had no way to be deployed. Selecting
# it is explicit, via EVENT_BUS_TYPE=kafka in 01-configmap-secrets.yaml — the
# same switch docker-compose.kafka.yml flips.
#
# ── Applying this ───────────────────────────────────────────────────────────
# Nothing references Kafka unless EVENT_BUS_TYPE says so, so `kubectl apply -f
# infra/k8s/` with the default config brings up an idle broker. Either set
# EVENT_BUS_TYPE=kafka when you apply it, or skip this file.
#
# ── KRaft combined mode ─────────────────────────────────────────────────────
# One process is both broker and controller. For replicas: 1 that is the only
# sane topology, and it matches docker-compose.kafka.yml exactly so the dev
# stack and this one fail the same way. Scaling past a single node means
# splitting the controller quorum out and revisiting KAFKA_CONTROLLER_QUORUM_
# VOTERS below — it names pod 0 only, so raising `replicas` here without that
# change gives you brokers that cannot join a quorum.
#
# ── Prefer a managed broker ─────────────────────────────────────────────────
# Single replica, no auth, no TLS, PLAINTEXT throughout — access is restricted
# by the NetworkPolicy in 14-network-policies.yaml, exactly as for Redis. For
# production point KAFKA_BROKERS at MSK / Confluent Cloud / Redpanda and delete
# this file.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: assurecode
  labels:
    app: kafka
spec:
  # Headless. A StatefulSet's pods need stable per-pod DNS
  # (kafka-0.kafka.assurecode.svc) for the controller quorum to address itself;
  # a ClusterIP would load-balance that and the quorum could not form.
  clusterIP: None
  ports:
    - port: 29092
      targetPort: 29092
      name: plaintext
    - port: 9093
      targetPort: 9093
      name: controller
  selector:
    app: kafka
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: assurecode
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      securityContext:
        # The apache/kafka image runs as uid 1000 (appuser) and owns nothing
        # under /var/lib/kafka in a fresh PVC, so fsGroup is what makes the
        # mounted volume writable. Without it the broker fails to format its
        # log directory and CrashLoopBackOffs with a permissions error that
        # reads like a corrupt volume.
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: kafka
          image: apache/kafka:3.8.1
          ports:
            - containerPort: 29092
              name: plaintext
            - containerPort: 9093
              name: controller
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@kafka-0.kafka.assurecode.svc.cluster.local:9093
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:29092,CONTROLLER://:9093
            # Only the in-cluster listener, unlike compose: nothing outside the
            # cluster reaches this broker, and advertising an address clients
            # cannot resolve is how a broker accepts a connection and then
            # hands back metadata pointing somewhere unreachable.
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka-0.kafka.assurecode.svc.cluster.local:29092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            # Off, matching docker-compose.kafka.yml and every managed cluster.
            # KafkaBus.ensureTopics() creates the topics at service boot; with
            # auto-create on, a typo'd topic name silently becomes a real
            # single-partition topic and caps that consumer group at one worker.
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
            # Fixed, not generated. The image formats the log directory with
            # this id on first boot; a value that changed between restarts
            # would make the existing PVC unreadable every time.
            - name: CLUSTER_ID
              value: assurecode-kraft-cluster
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          readinessProbe:
            # Through the broker's own client, so this goes green only once the
            # controller has elected a leader and the API is serving. A TCP
            # check on 29092 passes well before that, and a Service that starts
            # routing early sends the first publish into a broker that answers
            # with an empty metadata response.
            exec:
              command:
                - /bin/sh
                - -c
                - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            # Deliberately the cheaper check. Reusing the readiness exec here
            # would restart the broker during a long controller election —
            # killing the process that is in the middle of recovering.
            tcpSocket:
              port: 29092
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 16Gi
