# =============================================================================
# External Secrets Operator overlay — the recommended production path.
#
# Requires ESO installed in the cluster (it owns the SecretStore and
# ExternalSecret CRDs):
#     helm repo add external-secrets https://charts.external-secrets.io
#     helm install external-secrets external-secrets/external-secrets \
#         -n external-secrets --create-namespace
#
# Apply after the base:
#     kubectl apply -f infra/k8s/
#     kubectl apply -f infra/k8s/overlays/external-secrets/
#
# ESO then writes the `assurecode-secrets` Secret from your backing store,
# overwriting the placeholder from the base and refreshing it on the interval
# below. No Deployment changes: every workload already reads that Secret name
# via `envFrom.secretRef`.
#
# This lives outside the base because CI's `kubectl apply --dry-run=client
# -f infra/k8s/` is non-recursive and would otherwise fail on CRDs that are
# not installed on the runner.
#
# The SecretStore below is written for AWS Secrets Manager. Swap the
# `provider` block for vault / gcpsm / azurekv as needed — the ExternalSecret
# underneath is provider-agnostic.
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: assurecode-store
  namespace: assurecode
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        # Preferred: IRSA. Annotate the ServiceAccount with the role ARN and
        # ESO assumes it — no static keys in the cluster at all.
        jwt:
          serviceAccountRef:
            name: assurecode-external-secrets
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: assurecode-external-secrets
  namespace: assurecode
  annotations:
    # Replace with the IAM role granting secretsmanager:GetSecretValue on
    # the assurecode/* path.
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/assurecode-external-secrets"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: assurecode-secrets
  namespace: assurecode
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: assurecode-store
    kind: SecretStore
  target:
    # Same name the base creates and every Deployment's envFrom references.
    name: assurecode-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: assurecode/database
        property: url
    - secretKey: REDIS_URL
      remoteRef:
        key: assurecode/redis
        property: url
    - secretKey: NEO4J_URI
      remoteRef:
        key: assurecode/neo4j
        property: uri
    - secretKey: NEO4J_PASSWORD
      remoteRef:
        key: assurecode/neo4j
        property: password
    - secretKey: JWT_SECRET
      remoteRef:
        key: assurecode/auth
        property: jwt_secret
    - secretKey: SERVICE_TOKEN
      remoteRef:
        key: assurecode/auth
        property: service_token
    - secretKey: GITHUB_WEBHOOK_SECRET
      remoteRef:
        key: assurecode/github
        property: webhook_secret
    - secretKey: ML_DSA_SEED_HEX
      remoteRef:
        key: assurecode/ledger
        property: ml_dsa_seed_hex
    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        key: assurecode/stripe
        property: secret_key
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef:
        key: assurecode/stripe
        property: webhook_secret
