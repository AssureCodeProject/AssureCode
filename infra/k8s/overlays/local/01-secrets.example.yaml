# =============================================================================
# Template for a locally-applied Secret override (scratch clusters only).
#
# Copy to `01-secrets.local.yaml` in this directory (gitignored) and fill in
# real values, then:
#
#     kubectl apply -f infra/k8s/                                    # base
#     kubectl apply -f infra/k8s/overlays/local/01-secrets.local.yaml
#
# The second apply replaces the placeholder Secret from the base with real
# values, under the same name, so no Deployment needs changing.
#
# This directory is deliberately outside the base: CI runs
# `kubectl apply --dry-run=client -f infra/k8s/`, which is non-recursive, so
# nothing here is picked up as a duplicate of the base Secret.
#
# For anything shared or long-lived use External Secrets or Sealed Secrets
# instead — see the sibling overlay directories.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: assurecode-secrets
  namespace: assurecode
type: Opaque
stringData:
  # Postgres with pgvector. Must be reachable from inside the cluster.
  DATABASE_URL: "postgresql://USER:PASSWORD@HOST:5432/assurecode"

  REDIS_URL: "redis://HOST:6379"

  NEO4J_URI: "bolt://HOST:7687"
  NEO4J_PASSWORD: ""

  # Signing key for user JWTs. Generate with:
  #   node -e "console.log(require('crypto').randomBytes(48).toString('base64url'))"
  JWT_SECRET: ""

  # Shared token for machine callers (tools/benchmark.js, verify scripts).
  # Same generation command as JWT_SECRET; must differ from it.
  SERVICE_TOKEN: ""

  # HMAC secret configured on the GitHub webhook itself. webhook-ingest
  # refuses to boot in production without it.
  GITHUB_WEBHOOK_SECRET: ""

  # FIPS 204 ML-DSA-87 seed for signing Merkle roots. 32 bytes, hex.
  #   python -c "import os;print(os.urandom(32).hex())"
  # Production should hold this in an HSM/KMS and distribute only the public
  # key — see .env.example. This env var is the development posture.
  ML_DSA_SEED_HEX: ""

  # Razorpay. Deferred — createRazorpayAdapter() falls back to
  # FakeRazorpayAdapter whenever the key id is absent or not an `rzp_` key, so
  # leaving these empty is a working configuration for everything except real
  # money movement. The key *id* is public and set in the ConfigMap, not here.
  RAZORPAY_KEY_SECRET: ""
  RAZORPAY_WEBHOOK_SECRET: ""

  # Cloudflare Workers AI. Unlike the Razorpay pair above, leaving these empty
  # is NOT a working configuration: Cloudflare is the only LLM provider, so
  # ai-service raises LlmUnavailableError on the first generate call. Set
  # LLM_PROVIDER=fake in the ConfigMap for an offline cluster instead.
  CLOUDFLARE_ACCOUNT_ID: ""
  CLOUDFLARE_API_TOKEN: ""
