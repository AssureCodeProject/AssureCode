# Prometheus scrape configuration for the local stack.
#
# All four instrumented services. The Node pair use packages/telemetry
# (prom-client); the Python pair use app/ports/telemetry.py (prometheus_client),
# which deliberately shares the `assurecode_*` metric-name prefix so a dashboard
# can sum a family across both tiers.
#
# Tracing is still Node-only: the Python services emit metrics but no OTel
# spans, so a trace crossing into ai-service or scope-guard stops at the
# boundary in Jaeger.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["api-gateway:4000"]
        labels:
          service: api-gateway

  - job_name: webhook-ingest
    metrics_path: /metrics
    static_configs:
      - targets: ["webhook-ingest:9000"]
        labels:
          service: webhook-ingest

  - job_name: ai-service
    metrics_path: /metrics
    static_configs:
      - targets: ["ai-service:8000"]
        labels:
          service: ai-service

  - job_name: scope-guard
    metrics_path: /metrics
    static_configs:
      - targets: ["scope-guard:8001"]
        labels:
          service: scope-guard
