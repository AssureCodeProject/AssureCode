# Prometheus scrape configuration for the local stack.
#
# All six instrumented services. The Node quartet use packages/telemetry
# (prom-client) — ci-worker and settlement-worker via the minimal
# metrics-server.ts HTTP surface added for exactly this, since neither has
# any other route; the Python pair use app/ports/telemetry.py
# (prometheus_client), which deliberately shares the `assurecode_*`
# metric-name prefix so a dashboard can sum a family across both tiers.
#
# Tracing is still Node-only: the Python services emit metrics but no OTel
# spans, so a trace crossing into ai-service or scope-guard stops at the
# boundary in Jaeger.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alerting rules. There is no Alertmanager deployed, so these surface in
# Prometheus's own Alerts tab rather than paging — still better than counters
# nobody queries. Every rule uses a metric that already existed and was already
# scraped; none needed new instrumentation.
rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["api-gateway:4000"]
        labels:
          service: api-gateway

  - job_name: webhook-ingest
    metrics_path: /metrics
    static_configs:
      - targets: ["webhook-ingest:9000"]
        labels:
          service: webhook-ingest

  - job_name: ai-service
    metrics_path: /metrics
    static_configs:
      - targets: ["ai-service:8000"]
        labels:
          service: ai-service

  - job_name: scope-guard
    metrics_path: /metrics
    static_configs:
      - targets: ["scope-guard:8001"]
        labels:
          service: scope-guard

  - job_name: ci-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["ci-worker:5001"]
        labels:
          service: ci-worker

  - job_name: settlement-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["settlement-worker:5002"]
        labels:
          service: settlement-worker

  # Server-level Redis metrics (used_memory, connected_clients,
  # instantaneous_ops_per_sec, rejected_connections, ...) via redis_exporter,
  # not the app services themselves — none of the six above expose Redis's
  # own INFO output, only their own command-level spans.
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: redis
